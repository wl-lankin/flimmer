[package]
name = "flimmer-together"
version = "0.1.0"
edition = "2021"
description = "WebSocket relay for the Flimmer watch-together feature"
publish = false

[lib]
name = "flimmer_together"
path = "src/lib.rs"

[[bin]]
name = "flimmer-together"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "sync", "signal"] }
tokio-tungstenite = "0.26"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"

[profile.release]
lto = true
strip = true
